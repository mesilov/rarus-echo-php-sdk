name: Ошибка
description: Сообщить о воспроизводимой ошибке SDK, CLI или документации
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему так, чтобы ее можно было воспроизвести из чистого checkout или через опубликованный CLI image.
  - type: textarea
    id: summary
    attributes:
      label: Краткое описание
      description: Что сломалось и какая часть SDK или CLI затронута?
      placeholder: Например, submit --wait возвращает пустой stdout при успешной транскрибации.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - PHP SDK
        - CLI
        - Docker image
        - Документация
        - Maintainer workflow
        - OpenSpec
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Минимальные команды, входные данные и окружение, при которых ошибка повторяется.
      placeholder: |
        1. Установить пакет или запустить Docker image ...
        2. Выполнить команду ...
        3. Получить ошибку ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло вместо ожидаемого?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: Версия пакета, tag Docker image или commit SHA.
      placeholder: 0.3.0, cli, dev@abcdef1
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: PHP, Composer, Docker, ОС и другие существенные версии.
      placeholder: |
        PHP:
        Composer:
        Docker:
        OS:
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Логи и вывод команд
      description: Вставьте релевантный вывод без credentials, API keys, user IDs и приватных URL.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я убрал из описания credentials, API keys и другие секреты.
          required: true
        - label: Я проверил, что похожей открытой issue нет.
          required: true
