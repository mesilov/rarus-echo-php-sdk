name: Build Docker image

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/workflows/docker-build.yml'
      - '.dockerignore'
      - 'bin/rarus-echo'
      - 'composer.json'
      - 'src/**'
      - 'docker/rarus-echo-cli/**'
      - 'build/media/**'
      - 'build/licenses/**'
      - 'build/tests/docker-media-check.py'
      - 'build/tests/linkage-check.py'
      - 'tests/Fixtures/Media/**'
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/workflows/docker-build.yml'
      - '.dockerignore'
      - 'bin/rarus-echo'
      - 'composer.json'
      - 'src/**'
      - 'docker/rarus-echo-cli/**'
      - 'build/media/**'
      - 'build/licenses/**'
      - 'build/tests/docker-media-check.py'
      - 'build/tests/linkage-check.py'
      - 'tests/Fixtures/Media/**'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  accept:
    name: Accept native Docker ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Record image creation timestamp
        id: timestamp
        shell: bash
        run: echo "rfc3339=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build named no-media baseline
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rarus-echo-cli/Dockerfile
          target: cli-baseline
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: local/echo-baseline:${{ matrix.target }}
          cache-from: type=gha,scope=cli-${{ matrix.target }}
      - name: Build unpublished native candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rarus-echo-cli/Dockerfile
          target: cli
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: local/echo-accepted:${{ matrix.target }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.rfc3339 }}
          cache-from: type=gha,scope=cli-${{ matrix.target }}
          cache-to: type=gha,scope=cli-${{ matrix.target }},mode=max
      - name: Require offline toolkit, read-only fixtures, and complete size budget
        run: |
          python3 build/tests/docker-media-check.py local/echo-accepted:${{ matrix.target }} \
            --platform ${{ matrix.platform }} --baseline local/echo-baseline:${{ matrix.target }}
      - name: Preserve the exact accepted image
        run: docker save local/echo-accepted:${{ matrix.target }} -o dist/accepted-${{ matrix.target }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-accepted-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish accepted multi-architecture image
    if: github.event_name != 'pull_request'
    needs: accept
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-accepted-*
          merge-multiple: true
          path: dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only images accepted on both native targets
        shell: bash
        run: |
          for target in linux-amd64 linux-arm64; do
            docker load -i "dist/accepted-${target}.tar"
            docker tag "local/echo-accepted:${target}" "${IMAGE_NAME}:cli-${GITHUB_SHA}-${target}"
            docker push "${IMAGE_NAME}:cli-${GITHUB_SHA}-${target}"
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:cli" --tag "${IMAGE_NAME}:cli-${GITHUB_SHA}" \
            "${IMAGE_NAME}:cli-${GITHUB_SHA}-linux-amd64" \
            "${IMAGE_NAME}:cli-${GITHUB_SHA}-linux-arm64"
