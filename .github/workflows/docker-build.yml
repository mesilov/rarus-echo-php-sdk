name: Build Docker image

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/docker-build.yml"
      - ".dockerignore"
      - "bin/rarus-echo"
      - "composer.json"
      - "src/**"
      - "docker/rarus-echo-cli/**"
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/docker-build.yml"
      - ".dockerignore"
      - "bin/rarus-echo"
      - "composer.json"
      - "src/**"
      - "docker/rarus-echo-cli/**"
  workflow_dispatch: ~

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build CLI image
    runs-on: ubuntu-latest

    steps:
      - name: Get current timestamp
        id: timestamp
        run: echo "rfc3339=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rarus-echo-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:cli
            ${{ env.IMAGE_NAME }}:cli-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.rfc3339 }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
