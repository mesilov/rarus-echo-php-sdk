name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      UID: 1001
      GID: 1001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.3.1

      - name: Lint OpenSpec
        run: make lint-openspec

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker-compose.yaml', 'docker/php-cli/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker environment
        run: docker compose build

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}

      - name: Install dependencies
        run: make composer-install

      - name: Validate agent plugins
        run: make lint-agent-plugins

      - name: Run PHP linters
        run: make lint-php
